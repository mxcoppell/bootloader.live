/* ─── Reset & Base ───────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* ─── Navigation Bar ─────────────────────────────────── */
.nav-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(16px, 4vw, 48px);
    background: var(--toolbar-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--toolbar-border);
    z-index: 1000;
    transition: background 0.3s;
}

.nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
}

.nav-logo .logo-icon {
    font-size: 20px;
    line-height: 1;
    display: inline-block;
    position: relative;
    transition: transform 0.3s ease, filter 0.3s ease;
}

/* Exhaust trails via pseudo-elements */
.nav-logo .logo-icon::before,
.nav-logo .logo-icon::after {
    content: '';
    position: absolute;
    height: 2px;
    width: 0;
    opacity: 0;
    border-radius: 1px;
    transform: rotate(-45deg);
    transform-origin: right center;
    pointer-events: none;
}

.nav-logo .logo-icon::before {
    bottom: 2px;
    left: -6px;
    background: linear-gradient(to left, rgba(255, 160, 50, 0.9), rgba(255, 100, 0, 0.4), transparent);
}

.nav-logo .logo-icon::after {
    bottom: 6px;
    left: -3px;
    background: linear-gradient(to left, rgba(255, 200, 80, 0.8), rgba(255, 120, 0, 0.3), transparent);
}

.nav-logo:hover .logo-icon::before {
    animation: streak-1 0.8s ease-out infinite;
}

.nav-logo:hover .logo-icon::after {
    animation: streak-2 0.6s ease-out infinite 0.2s;
}

.nav-logo:hover .logo-icon {
    animation: rocket-drift 2s ease-in-out infinite;
    filter: drop-shadow(0 1px 4px rgba(255, 140, 0, 0.3));
}

@keyframes rocket-drift {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(1px, -1px); }
    100% { transform: translate(0, 0); }
}

@keyframes streak-1 {
    0%   { width: 0; opacity: 0; }
    40%  { opacity: 0.9; }
    100% { width: 20px; opacity: 0; }
}

@keyframes streak-2 {
    0%   { width: 0; opacity: 0; }
    40%  { opacity: 0.7; }
    100% { width: 14px; opacity: 0; }
}

.nav-logo .logo-icon .streak-3 {
    position: absolute;
    bottom: -1px;
    left: -8px;
    height: 2px;
    width: 0;
    opacity: 0;
    border-radius: 1px;
    background: linear-gradient(to left, rgba(255, 140, 30, 0.7), rgba(255, 80, 0, 0.3), transparent);
    transform: rotate(-45deg);
    transform-origin: right center;
    pointer-events: none;
}

.nav-logo:hover .logo-icon .streak-3 {
    animation: streak-3 0.7s ease-out infinite 0.4s;
}

@keyframes streak-3 {
    0%   { width: 0; opacity: 0; }
    40%  { opacity: 0.6; }
    100% { width: 16px; opacity: 0; }
}

.nav-actions {
    display: flex;
    align-items: center;
    gap: 4px;
}

.nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    transition: background 0.15s, color 0.15s;
}

.nav-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.nav-btn svg { width: 18px; height: 18px; }

/* ─── Back Button ────────────────────────────────────── */
.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 0;
    transition: color 0.15s;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
}

.back-btn:hover { color: var(--accent-color); }
.back-btn svg { width: 16px; height: 16px; }

/* ─── Landing Page ───────────────────────────────────── */
.landing-view {
    max-width: 960px;
    margin: 0 auto;
    padding: 120px clamp(20px, 4vw, 40px) 80px;
}

.hero { margin-bottom: 64px; }

.hero-title {
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
    font-size: clamp(2.4rem, 5vw, 3.2rem);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    color: var(--text-primary);
}

.hero-subtitle {
    font-size: 17px;
    line-height: 1.7;
    color: var(--text-secondary);
}

/* ─── Post List ──────────────────────────────────────── */
.posts-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.post-card {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 24px 0;
    border-bottom: 1px solid var(--border-subtle);
    transition: opacity 0.15s;
}

.post-card:first-child { border-top: 1px solid var(--border-subtle); }
.post-card:hover { opacity: 0.75; }

.post-card-date {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
}

.post-card-title {
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
    font-size: 1.35rem;
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
}

.post-card-excerpt {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-secondary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.post-card-tags {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.post-tag {
    font-size: 12px;
    color: var(--text-muted);
    padding: 2px 8px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
}

/* ─── Post View ──────────────────────────────────────── */
.post-view {
    display: none;
    max-width: 960px;
    margin: 0 auto;
    padding: 100px clamp(20px, 4vw, 40px) 80px;
}

.post-view.active { display: block; }
.landing-view.hidden { display: none; }

.post-header {
    margin-bottom: 40px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border-subtle);
}

.post-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--text-muted);
}

.post-meta-dot { opacity: 0.4; }

.post-title {
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
    font-size: clamp(2rem, 4.5vw, 2.6rem);
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -0.02em;
}

/* ─── Article Content (mdp-matching exactly) ─────────── */
.post-content .markdown-body {
    background: transparent !important;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    word-wrap: break-word;
}

.post-content .markdown-body > h1:first-child { display: none; }

.post-content .markdown-body h1, .post-content .markdown-body h2,
.post-content .markdown-body h3, .post-content .markdown-body h4,
.post-content .markdown-body h5, .post-content .markdown-body h6 {
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
    scroll-margin-top: 70px;
}

.post-content .markdown-body h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-subtle); }
.post-content .markdown-body h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-subtle); }
.post-content .markdown-body h3 { font-size: 1.25em; }
.post-content .markdown-body h4 { font-size: 1em; }
.post-content .markdown-body h5 { font-size: 0.875em; }
.post-content .markdown-body h6 { font-size: 0.85em; color: var(--text-secondary); }

.post-content .markdown-body p { margin-top: 0; margin-bottom: 16px; }
.post-content .markdown-body a { color: var(--link-color); text-decoration: none; }
.post-content .markdown-body a:hover { text-decoration: underline; }
.post-content .markdown-body strong { font-weight: 600; }
.post-content .markdown-body em { font-style: italic; }
.post-content .markdown-body del { color: var(--text-secondary); }

.post-content .markdown-body blockquote {
    margin: 0 0 16px;
    padding: 0 1em;
    color: var(--text-secondary);
    border-left: 3px solid var(--border-color);
}

.post-content .markdown-body ul, .post-content .markdown-body ol {
    margin-top: 0;
    margin-bottom: 16px;
    padding-left: 2em;
}

.post-content .markdown-body li + li { margin-top: 4px; }

.post-content .markdown-body hr {
    height: 2px;
    padding: 0;
    margin: 24px 0;
    background-color: var(--border-subtle);
    border: 0;
}

.post-content .markdown-body img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
}

/* Tables - forced colors to beat CDN github-markdown.css */
.post-content .markdown-body table { border-collapse: collapse; border-spacing: 0; width: 100%; margin-bottom: 16px; overflow: auto; display: block; }
.post-content .markdown-body table th, .post-content .markdown-body table td { padding: 6px 13px; }

[data-theme="dark"] .post-content .markdown-body table th,
[data-theme="dark"] .post-content .markdown-body table td { border: 1px solid #21262d !important; color: #e6edf3 !important; }
[data-theme="dark"] .post-content .markdown-body table th { font-weight: 600; background: #313131 !important; }
[data-theme="dark"] .post-content .markdown-body table tr { background: #222222 !important; }
[data-theme="dark"] .post-content .markdown-body table tr:nth-child(2n) { background: #2a2a2a !important; }

[data-theme="light"] .post-content .markdown-body table th,
[data-theme="light"] .post-content .markdown-body table td { border: 1px solid #e8eaed !important; color: #1f2328 !important; }
[data-theme="light"] .post-content .markdown-body table th { font-weight: 600; background: #ebebeb !important; }
[data-theme="light"] .post-content .markdown-body table tr { background: #f8f8f8 !important; }
[data-theme="light"] .post-content .markdown-body table tr:nth-child(2n) { background: #f5f5f5 !important; }

/* Code - forced colors to beat CDN github-markdown.css */
.post-content .markdown-body code { padding: 0.2em 0.4em; font-size: 85%; font-family: "SF Mono", Monaco, Menlo, "Courier New", monospace; border-radius: 4px; }
.post-content .markdown-body pre { padding: 9px; overflow-x: auto; font-size: 13px; line-height: 1.45; border: none; border-radius: 6px; margin-bottom: 16px; }
.post-content .markdown-body pre code { padding: 0; background: transparent !important; border-radius: 0; font-size: 100%; }

[data-theme="dark"] .post-content .markdown-body code { background: #2a2a2a !important; color: #e6edf3 !important; }
[data-theme="dark"] .post-content .markdown-body pre { background: #2a2a2a !important; color: #e6edf3 !important; }
[data-theme="light"] .post-content .markdown-body code { background: #f5f5f5 !important; color: #1f2328 !important; }
[data-theme="light"] .post-content .markdown-body pre { background: #f5f5f5 !important; color: #1f2328 !important; }

/* Definition lists */
.post-content .markdown-body dl { margin-bottom: 16px; }
.post-content .markdown-body dt { font-weight: 600; margin-top: 8px; }
.post-content .markdown-body dd { margin-left: 2em; margin-bottom: 4px; }

/* Task lists */
.post-content .markdown-body li > input[type="checkbox"] {
    -webkit-appearance: none; appearance: none;
    width: 0.75em; height: 0.75em;
    border: 1px solid var(--border-color); border-radius: 3px;
    background: transparent; margin-right: 0.4em; vertical-align: -0.05em; pointer-events: none;
}
.post-content .markdown-body li > input[type="checkbox"]:checked {
    background: var(--accent-color); border-color: var(--accent-color);
}

/* Mermaid */
.mermaid-container {
    text-align: center;
    margin: 24px 0;
    padding: 20px;
    background: transparent;
    border-radius: 8px;
    overflow-x: auto;
}

.mermaid-container svg { max-width: 100%; height: auto; }
.mermaid-rendered svg > rect:first-child { fill: transparent !important; }

/* ─── TOC Panel ──────────────────────────────────────── */
.toc-toggle {
    position: fixed;
    right: clamp(12px, 2vw, 24px);
    bottom: 24px;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--toolbar-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--text-secondary);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 900;
    transition: background 0.15s, color 0.15s;
}

.toc-toggle:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.toc-toggle.visible { display: flex; }

.toc-panel {
    position: fixed;
    right: clamp(12px, 2vw, 24px);
    bottom: 72px;
    width: 260px;
    max-height: 60vh;
    background: var(--toolbar-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow-y: auto;
    padding: 12px 0;
    z-index: 900;
    display: none;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
}

.toc-panel.open { display: block; }

.toc-panel-header {
    padding: 4px 16px 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
}

.toc-list { list-style: none; padding: 0; margin: 0; }

.toc-list a {
    display: block;
    padding: 5px 16px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    line-height: 1.4;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.toc-list a:hover { color: var(--text-primary); background: var(--toc-active); }
.toc-list a.active { color: var(--accent-color); border-left-color: var(--toc-active-border); background: var(--toc-active); }
.toc-list .toc-h2 { padding-left: 16px; }
.toc-list .toc-h3 { padding-left: 28px; font-size: 12px; }
.toc-list .toc-h4 { padding-left: 40px; font-size: 12px; }

/* ─── Reading Progress ───────────────────────────────── */
.reading-progress {
    position: fixed;
    top: 56px;
    left: 0;
    width: 0%;
    height: 2px;
    background: var(--accent-color);
    z-index: 1001;
    transition: width 0.1s linear;
}

/* ─── Footer ─────────────────────────────────────────── */
.site-footer {
    text-align: center;
    padding: 48px 20px;
    font-size: 13px;
    color: var(--text-muted);
    border-top: 1px solid var(--border-subtle);
    margin-top: 48px;
}

.site-footer a { color: var(--text-secondary); text-decoration: none; }
.site-footer a:hover { color: var(--accent-color); }

/* ─── Page Transitions ───────────────────────────────── */
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ─── Responsive ─────────────────────────────────────── */
@media (max-width: 640px) {
    .hero-title { font-size: 2rem; }
    .post-card-title { font-size: 1.15rem; }
    .post-title { font-size: 1.7rem; }
    .post-content .markdown-body { font-size: 15px; }
    .toc-panel { width: calc(100vw - 32px); right: 16px; }
    .nav-logo span { display: none; }
}

/* ─── Loading State ──────────────────────────────────── */
.loading {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 48px;
    color: var(--text-muted);
    font-size: 14px;
    gap: 10px;
}

.loading::after {
    content: '';
    width: 20px;
    height: 20px;
    border: 2px solid var(--border-color);
    border-top-color: var(--accent-color);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Theme sync ─────────────────────────────────────── */
.markdown-body { background-color: transparent !important; }
[data-theme="dark"] .hljs { background: var(--code-bg) !important; }
[data-theme="light"] .hljs { background: var(--code-bg) !important; }

/* ─── HTML-format post components ─────────────────────── */
.post-html .section-badge {
    display: flex;
    justify-content: center;
    margin: 3rem 0 1.5rem;
}
.post-html .section-badge span {
    background: #455a64;
    color: #ffffff;
    border: 3px solid #90a4ae;
    border-radius: 999px;
    padding: 8px 40px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.02em;
    font-family: system-ui, sans-serif;
    text-align: center;
}

/* HTML-format post typography: body stays bright (inherits markdown-body's
   --fgColor-default) for readability. <strong> pops by weight only (700 vs
   the inherited 400). <em> recedes via --text-muted + italic. <figcaption>
   muted as secondary text. Note: deviates from the source preview's muted-
   body design choice — bright body is preferred here. */
.post-content .post-html strong { font-weight: 700; }
.post-content .post-html em { color: var(--text-muted); font-style: italic; }
.post-content .post-html figcaption { color: var(--text-muted); }

.post-html .lead {
    font-size: 1.15em;
    color: var(--text-primary);
    line-height: 1.6;
}

/* Selectors are .post-content .post-html (specificity 0,2,1) to beat the existing
   .post-content .markdown-body rules above without resorting to !important. */
.post-content .post-html p { line-height: 1.65; }
.post-content .post-html ol li,
.post-content .post-html ul li { line-height: 1.65; margin: 0.3em 0; }
.post-content .post-html h3 {
    color: var(--text-primary);
    border: none;
    padding-bottom: 0;
    margin-top: 2em;
    font-size: 1.2em;
}
.post-content .post-html hr {
    border: none;
    border-top: 1px solid var(--bg-tertiary);
    background: transparent;
    height: auto;
    margin: 2.5em 0;
    padding: 0;
}
.post-content .post-html figure { margin: 1.8em 0; text-align: center; }
.post-content .post-html figure img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    background: #fff;
}
.post-content .post-html figcaption {
    color: var(--text-muted);
    font-size: 0.9em;
    margin-top: 0.6em;
    font-style: italic;
}

/* Callouts: translucent tint of the page background, colored left border.
   The tint communicates type (blue = note, amber = warn); the border anchors it. */
.post-html .callout-note,
.post-html .callout-warn {
    border-left: 4px solid var(--accent-color);
    padding: 1em 1.4em;
    margin: 1.5em 0;
    border-radius: 4px;
    line-height: 1.55;
}
.post-html .callout-note {
    background: rgba(88, 166, 255, 0.08);
    border-left-color: var(--accent-color);
}
.post-html .callout-warn {
    background: rgba(240, 160, 32, 0.08);
    border-left-color: var(--warn-color);
}
[data-theme="light"] .post-html .callout-note {
    background: rgba(37, 99, 235, 0.08);
}
[data-theme="light"] .post-html .callout-warn {
    background: rgba(154, 103, 0, 0.10);
}

.post-html .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin: 1.5rem 0;
}
@media (max-width: 600px) {
    .post-html .compare-grid {
        grid-template-columns: 1fr;
    }
}

.post-html .svg-figure {
    margin: 2rem 0;
    padding: 24px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    text-align: center;
}
.post-html .svg-figure svg {
    max-width: 100%;
    height: auto;
    display: block;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 500;
}
.post-html .svg-figure .node {
    fill: var(--bg-tertiary);
    stroke: var(--text-secondary);
    stroke-width: 1.5;
    transition: stroke 0.15s ease, fill 0.15s ease;
}
.post-html .svg-figure .node[tabindex] { cursor: pointer; outline: none; }
.post-html .svg-figure .node[tabindex]:hover,
.post-html .svg-figure .node[tabindex]:focus,
.post-html .svg-figure .node[data-active="true"] {
    stroke: var(--accent-color);
    stroke-width: 2;
}
.post-html .svg-figure .edge {
    stroke: var(--text-secondary);
    stroke-width: 1.5;
    fill: none;
}
.post-html .svg-figure .edge[data-active="true"] {
    stroke: var(--accent-color);
    stroke-width: 2;
}
.post-html .svg-figure .edge[data-completed="true"] {
    stroke: var(--text-muted);
}
.post-html .svg-figure .label {
    fill: var(--text-primary);
    pointer-events: none;
}
.post-html .svg-figure .label.box-title { font-size: 17px; font-weight: 600; fill: var(--text-primary); }
.post-html .svg-figure .label.layer-tag { font-size: 11px; fill: var(--text-secondary); letter-spacing: 0.08em; }
.post-html .svg-figure .label.layer-name { font-size: 18px; fill: var(--text-primary); }
.post-html .svg-figure .label.layer-sub { font-size: 12px; fill: var(--text-secondary); }
.post-html .svg-figure .label.callout { font-size: 13px; fill: var(--text-primary); }
.post-html .svg-figure .label.callout-sub { font-size: 11px; fill: var(--text-secondary); font-style: italic; }
.post-html .svg-figure .label.doc-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: var(--text-primary); }
.post-html .svg-figure .label.bracket-label { font-size: 11px; fill: var(--text-secondary); letter-spacing: 0.1em; }
.post-html .svg-figure .label.tool-num { font-size: 16px; fill: var(--accent-color); }
.post-html .svg-figure .label.tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; fill: var(--text-primary); }
.post-html .svg-figure .label.tool-sub { font-size: 11px; fill: var(--text-secondary); }
.post-html .svg-figure .doc-rect { fill: var(--bg-tertiary); stroke: var(--text-secondary); }
.post-html .svg-figure .tool-box { fill: var(--bg-tertiary); }
.post-html .svg-figure .layer-band { fill: var(--bg-tertiary); stroke: var(--text-secondary); stroke-width: 1; opacity: 0.5; }
.post-html .svg-figure [data-step] .step-arrow { stroke: var(--text-secondary); stroke-width: 1; opacity: 0.4; }

/* step-through interaction states. Host JS sets [data-active="true"]; source-preview JS
   may instead add the .active-step class. Both selectors cover both conventions. */
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step] { opacity: 0.35; transition: opacity 200ms ease; }
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step][data-active="true"],
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step].active-step { opacity: 1; }
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step][data-active="true"] .layer-band,
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step].active-step .layer-band { stroke: var(--accent-color); stroke-width: 2; opacity: 1; }
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step][data-active="true"] .step-arrow,
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step].active-step .step-arrow { stroke: var(--accent-color); stroke-width: 2; opacity: 1; }
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step][data-active="true"] .edge,
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step].active-step .edge { stroke: var(--accent-color); stroke-width: 2; }
.post-html .svg-figure[data-interaction="step-through"].js-ready .node.active-step { stroke: var(--accent-color); stroke-width: 2; }
.post-html .svg-figure[data-interaction="step-through"].js-ready rect.node.active-step { fill: rgba(88, 166, 255, 0.15); }
.post-html .svg-figure[data-interaction="step-through"].js-ready text.label.active-step { fill: var(--accent-color); }
.post-html .svg-figure[data-interaction="step-through"].js-ready .edge.active-step { stroke: var(--accent-color); stroke-width: 2; }
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step][data-completed="true"] { opacity: 0.65; }
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step][data-completed="true"] .step-arrow { stroke: var(--text-muted); opacity: 0.6; }
/* .active-step wins over [data-completed="true"] (same specificity, later in source). */
.post-html .svg-figure[data-interaction="step-through"].js-ready [data-step].active-step { opacity: 1; }

.post-html .svg-legend {
    min-height: 2.5rem;
    margin-top: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: 4px;
    font-size: 0.9rem;
    text-align: left;
}
.post-html .svg-legend strong { color: var(--text-primary); margin-right: 0.5rem; }

.post-html .svg-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
}
.post-html .svg-controls button {

    color: var(--text-primary);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 4px 16px;

}
.post-html .svg-controls button:hover { border-color: var(--accent-color); }
.post-html .svg-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
.post-html .svg-controls .step-indicator {
    color: var(--text-muted);
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;

    text-align: center;
}

.post-html .svg-tabs {
    display: flex;

}
.post-html .svg-tabs button {

}
.post-html .svg-tabs button[aria-selected="true"] {

/* No-JS fallback: when JS hasn't marked the figure ready, show everything */
.post-html .svg-figure:not(.js-ready) .svg-legend { display: none; }
.post-html .svg-figure:not(.js-ready) .svg-controls { display: none; }
.post-html .svg-figure[data-interaction="toggle-view"]:not(.js-ready) [data-view] { display: block; }
.post-html .svg-figure[data-interaction="toggle-view"]:not(.js-ready) [data-view][hidden] { display: block !important; }
    </style>

// ─── Mermaid Counter ────────────────────────────────────
var mermaidCounter = 0;

// ─── Markdown Rendering ─────────────────────────────────
function initMarked() {
    marked.use({ gfm: true, breaks: false });
}

// Extract mermaid blocks before markdown parsing, replace with placeholders
var mermaidStore = {};
var mermaidIdx = 0;

function extractMermaid(md) {
    mermaidStore = {};
    mermaidIdx = 0;
    return md.replace(/```mermaid\n([\s\S]*?)```/g, function(match, code) {
        var id = 'MERMAID_PLACEHOLDER_' + (mermaidIdx++);
        mermaidStore[id] = code.trim();
        return '<div class="mermaid-container" id="' + id + '"></div>';
    });
}

function renderMarkdown(md, basePath) {
    // Rewrite relative image paths
    var processed = md.replace(/!\[([^\]]*)\]\((?!http)([^)]+)\)/g, function(match, alt, src) {
        return '![' + alt + '](' + basePath + src + ')';
    });

    // Extract mermaid blocks before marked parsing
    processed = extractMermaid(processed);

    // Parse markdown (mermaid placeholders pass through as raw HTML)
    var html = marked.parse(processed);

    // Sanitize but preserve our mermaid placeholder divs
    html = DOMPurify.sanitize(html, {
        ADD_TAGS: ['div'],
        ADD_ATTR: ['class', 'style', 'id'],
        ALLOW_DATA_ATTR: true
    });

    return html;
}

// Sanitize HTML-fragment posts with SVG + component-class allowlist.
// Per-post <script> blocks are NOT allowed; interactivity lives in initSvgInteractions().
function sanitizeHtmlFragment(html, basePath) {
    // Rewrite relative image paths the same way renderMarkdown does
    var processed = html.replace(/(<img[^>]+src=")(?!https?:|\/)/g, function(match) {
        return match + basePath;
    });

    return DOMPurify.sanitize(processed, {
        USE_PROFILES: { html: true, svg: true, svgFilters: true },
        ADD_TAGS: ['use'],
        ADD_ATTR: [
            'class', 'style', 'id', 'role', 'tabindex', 'hidden', 'aria-selected',
            'aria-live', 'aria-labelledby', 'aria-label', 'viewBox', 'preserveAspectRatio',
            'data-interaction', 'data-step', 'data-steps', 'data-view', 'data-action',
            'data-label', 'data-desc', 'data-active', 'data-completed'
        ],
        ALLOW_DATA_ATTR: true,
        FORBID_TAGS: ['script', 'iframe', 'object', 'embed'],
        FORBID_ATTR: ['onerror', 'onclick', 'onload', 'onmouseover']
    });
}

// ─── SVG Interaction Patterns ──────────────────────────
// All interaction logic lives here so per-post <script> is never needed.
// Three patterns: hover-reveal, step-through, toggle-view.
function initSvgInteractions(root) {
    root.querySelectorAll('.svg-figure[data-interaction="hover-reveal"]').forEach(initHoverReveal);
    root.querySelectorAll('.svg-figure[data-interaction="step-through"]').forEach(initStepThrough);
    root.querySelectorAll('.svg-figure[data-interaction="toggle-view"]').forEach(initToggleView);
}

// Update a legend element with a bolded label and following description text.
// Uses safe DOM construction — never writes to innerHTML.
function setLegendContent(legend, label, desc) {
    while (legend.firstChild) legend.removeChild(legend.firstChild);
    if (label) {
        var strong = document.createElement('strong');
        strong.textContent = label;
        legend.appendChild(strong);
    }
    if (desc) {
        legend.appendChild(document.createTextNode(desc));
    }
}

function initHoverReveal(figure) {
    figure.classList.add('js-ready');
    var legend = figure.querySelector('.svg-legend');
    if (!legend) return;

    var nodes = figure.querySelectorAll('.node[data-label]');
    nodes.forEach(function(node) {
        // Make focusable for keyboard users
        if (!node.hasAttribute('tabindex')) node.setAttribute('tabindex', '0');
        if (!node.hasAttribute('role')) node.setAttribute('role', 'button');
        var label = node.getAttribute('data-label') || '';
        var desc = node.getAttribute('data-desc') || '';
        node.setAttribute('aria-label', label + (desc ? '. ' + desc : ''));

        var show = function() {
            nodes.forEach(function(n) { n.removeAttribute('data-active'); });
            node.setAttribute('data-active', 'true');
            setLegendContent(legend, label, desc);
        };
        var hide = function() {
            node.removeAttribute('data-active');
            // Keep legend showing last value; do not clear on leave to avoid flicker
        };
        node.addEventListener('mouseenter', show);
        node.addEventListener('focus', show);
        node.addEventListener('mouseleave', hide);
        node.addEventListener('blur', hide);
    });

    // Show first node's label as the initial state so the legend isn't empty
    if (nodes.length > 0) {
        var first = nodes[0];
        setLegendContent(
            legend,
            first.getAttribute('data-label') || '',
            first.getAttribute('data-desc') || ''
        );
    }
}

function initStepThrough(figure) {
    figure.classList.add('js-ready');
    var totalSteps = parseInt(figure.getAttribute('data-steps') || '0', 10);
    var stepEls = figure.querySelectorAll('[data-step]');
    var indicator = figure.querySelector('.step-indicator');
    var prevBtn = figure.querySelector('[data-action="prev"]');
    var nextBtn = figure.querySelector('[data-action="next"]');
    var current = 1;

    function render() {
        stepEls.forEach(function(el) {
            var n = parseInt(el.getAttribute('data-step') || '0', 10);
            el.removeAttribute('data-active');
            el.removeAttribute('data-completed');
            if (n < current) el.setAttribute('data-completed', 'true');
            if (n === current) el.setAttribute('data-active', 'true');
        });
        if (indicator) indicator.textContent = current + ' / ' + totalSteps;
        if (prevBtn) prevBtn.disabled = (current === 1);
        if (nextBtn) nextBtn.disabled = (current === totalSteps);
    }

    if (prevBtn) prevBtn.addEventListener('click', function() { if (current > 1) { current--; render(); } });
    if (nextBtn) nextBtn.addEventListener('click', function() { if (current < totalSteps) { current++; render(); } });
    render();
}

function initToggleView(figure) {
    figure.classList.add('js-ready');
    var tabs = figure.querySelectorAll('.svg-tabs [data-view]');
    var views = figure.querySelectorAll('svg [data-view]');

    function selectView(name) {
        tabs.forEach(function(t) {
            var sel = t.getAttribute('data-view') === name;
            t.setAttribute('aria-selected', sel ? 'true' : 'false');
        });
        // Toggle the SVG-native `display` attribute (not the HTML `hidden` attribute)
        // because `hidden` is inconsistently honored on SVG <g> elements across browsers.
        // Also clear any stale `hidden` from older post markup for backward compat.
        views.forEach(function(v) {
            if (v.getAttribute('data-view') === name) {
                v.removeAttribute('display');
                v.removeAttribute('hidden');
            } else {
                v.setAttribute('display', 'none');
            }
        });
    }

    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() { selectView(tab.getAttribute('data-view')); });
    });

    // Initial: first tab with aria-selected="true", else first tab
    var initialTab = figure.querySelector('.svg-tabs [aria-selected="true"]') || tabs[0];
    if (initialTab) selectView(initialTab.getAttribute('data-view'));
}

// Wait for mermaid ESM to load
function waitForMermaid() {
    return new Promise(function(resolve) {
        if (typeof mermaid !== 'undefined' && window.mermaid) { resolve(); return; }
        window.addEventListener('mermaid-loaded', function() { resolve(); }, { once: true });
        // Timeout fallback
        setTimeout(resolve, 5000);
    });
}

// Render mermaid diagrams - matches mdp: direct SVG insertion
async function renderMermaidDiagrams() {
    await waitForMermaid();
    if (typeof mermaid === 'undefined') return;

    var effective = getTheme();
    mermaid.initialize({
        startOnLoad: false,
        theme: effective === 'dark' ? 'dark' : 'default',
        themeVariables: {
            background: 'transparent'
        },
        securityLevel: 'strict',
        logLevel: 'error'
    });

    var keys = Object.keys(mermaidStore);
    for (var i = 0; i < keys.length; i++) {
        var id = keys[i];
        var container = document.getElementById(id);
        if (!container) continue;
        var code = mermaidStore[id];
        var renderId = 'mermaid-' + i + '-' + Date.now();
        try {
            var result = await mermaid.render(renderId, code);
            container.textContent = '';
            container.insertAdjacentHTML('afterbegin', result.svg);
            container.classList.add('mermaid-rendered');
        } catch (e) {
            container.textContent = 'Mermaid error: ' + e.message;
            container.style.color = 'var(--text-muted)';
            container.style.fontSize = '13px';
        }
    }
}

function fixThemeColors() {
    var isDark = getTheme() === 'dark';
    var body = document.getElementById('post-body');
    if (!body) return;

    // Fix table rows
    body.querySelectorAll('table tr').forEach(function(tr, i) {
        if (i === 0 && tr.querySelector('th')) {
            // header row - handled by th styles
        } else {
            tr.style.backgroundColor = isDark
                ? (i % 2 === 0 ? '#222222' : '#2a2a2a')
                : (i % 2 === 0 ? '#f8f8f8' : '#f5f5f5');
        }
    });
    body.querySelectorAll('table th').forEach(function(th) {
        th.style.backgroundColor = isDark ? '#313131' : '#ebebeb';
        th.style.color = isDark ? '#e6edf3' : '#1f2328';
        th.style.borderColor = isDark ? '#21262d' : '#e8eaed';
    });
    body.querySelectorAll('table td').forEach(function(td) {
        td.style.color = isDark ? '#e6edf3' : '#1f2328';
        td.style.borderColor = isDark ? '#21262d' : '#e8eaed';
    });

    // Fix code blocks
    body.querySelectorAll('pre').forEach(function(pre) {
        pre.style.backgroundColor = isDark ? '#2a2a2a' : '#f5f5f5';
        pre.style.color = isDark ? '#e6edf3' : '#1f2328';
    });
    body.querySelectorAll('code').forEach(function(code) {
        if (!code.closest('pre')) {
            code.style.backgroundColor = isDark ? '#2a2a2a' : '#f5f5f5';
            code.style.color = isDark ? '#e6edf3' : '#1f2328';
        }
    });
}

// ─── TOC Generation ─────────────────────────────────────
function generateToc() {
    const headings = document.querySelectorAll('#post-body h2, #post-body h3, #post-body h4');
    const tocList = document.getElementById('toc-list');
    const tocToggle = document.getElementById('toc-toggle');

    tocList.textContent = '';

    if (headings.length < 3) {
        tocToggle.classList.remove('visible');
        return;
    }

    tocToggle.classList.add('visible');

    headings.forEach(function(heading, i) {
        var id = 'heading-' + i;
        heading.id = id;
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = heading.textContent;
        a.className = 'toc-' + heading.tagName.toLowerCase();
        a.addEventListener('click', function(e) {
            e.preventDefault();
            heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        li.appendChild(a);
        tocList.appendChild(li);
    });
}

function toggleToc() {
    document.getElementById('toc-panel').classList.toggle('open');
}

// ─── Reading Progress ───────────────────────────────────
function updateReadingProgress() {
    if (currentView !== 'post') {
        document.getElementById('reading-progress').style.width = '0%';
        return;
    }
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    var scrolled = window.scrollY;
    var progress = docHeight > 0 ? (scrolled / docHeight) * 100 : 0;
    document.getElementById('reading-progress').style.width = progress + '%';
}

// ─── Utilities ──────────────────────────────────────────
function readingTime(text, isHtml) {
    var stripped = isHtml
        ? text.replace(/<svg[\s\S]*?<\/svg>/gi, ' ').replace(/<[^>]+>/g, ' ')
        : text;
    var words = stripped.trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.ceil(words / 230)) + ' min read';
}

function formatDate(dateStr) {
    var date = new Date(dateStr + 'T12:00:00');
    return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

// ─── Render Landing ─────────────────────────────────────
function renderLanding() {
    var list = document.getElementById('posts-list');
    list.textContent = '';

    POSTS.forEach(function(post) {
        var card = document.createElement('a');
        card.className = 'post-card';
        card.href = '/posts/' + post.slug + '/';
        card.addEventListener('click', function(e) {
            e.preventDefault();
            showPost(post.slug);
        });

        var dateDiv = document.createElement('div');
        dateDiv.className = 'post-card-date';
        dateDiv.textContent = formatDate(post.date);
        card.appendChild(dateDiv);

        var titleDiv = document.createElement('div');
        titleDiv.className = 'post-card-title';
        titleDiv.textContent = post.title;
        card.appendChild(titleDiv);

        var excerptDiv = document.createElement('div');
        excerptDiv.className = 'post-card-excerpt';
        excerptDiv.textContent = post.excerpt;
        card.appendChild(excerptDiv);

        var tagsDiv = document.createElement('div');
        tagsDiv.className = 'post-card-tags';
        post.tags.forEach(function(t) {
            var span = document.createElement('span');
            span.className = 'post-tag';
            span.textContent = t;
            tagsDiv.appendChild(span);
        });
        card.appendChild(tagsDiv);

        list.appendChild(card);
    });
}

// ─── Meta Tag Updates ───────────────────────────────────
function updateMetaTag(name, content, attr) {
    attr = attr || 'name';
    var selector = 'meta[' + attr + '="' + name + '"]';
    var el = document.querySelector(selector);
    if (el) {
        el.setAttribute('content', content);
    }
}

// ─── Navigation ─────────────────────────────────────────
var currentView = 'landing';
var postCache = {};

function showLanding(skipPush) {
    currentView = 'landing';
    document.getElementById('landing-view').classList.remove('hidden');
    document.getElementById('post-view').classList.remove('active');
    document.getElementById('reading-progress').style.width = '0%';
    document.getElementById('toc-toggle').classList.remove('visible');
    document.getElementById('toc-panel').classList.remove('open');
    document.title = 'bootloader.live \u2014 AI Productivity';
    updateMetaTag('description', 'Practical writing on AI-assisted development, MCP tools, and developer productivity.');
    updateMetaTag('og:title', 'bootloader.live \u2014 AI Productivity', 'property');
    updateMetaTag('og:description', 'Practical writing on AI-assisted development, MCP tools, and developer productivity.', 'property');
    updateMetaTag('og:url', 'https://bootloader.live/', 'property');
    updateMetaTag('twitter:title', 'bootloader.live \u2014 AI Productivity');
    updateMetaTag('twitter:description', 'Practical writing on AI-assisted development, MCP tools, and developer productivity.');
    if (!skipPush && location.pathname !== '/') {
        history.pushState({ view: 'landing' }, '', '/');
    }
    window.scrollTo(0, 0);
}

async function showPost(slug, skipPush) {
    var post = POSTS.find(function(p) { return p.slug === slug; });
    if (!post) { showLanding(); return; }

    if (!skipPush) {
        history.pushState({ view: 'post', slug: slug }, '', '/posts/' + slug + '/');
    }

    currentView = 'post';
    document.getElementById('landing-view').classList.add('hidden');
    document.getElementById('post-view').classList.add('active');

    document.getElementById('post-title').textContent = post.title;
    document.title = post.title + ' \u2014 bootloader.live';
    updateMetaTag('description', post.excerpt);
    updateMetaTag('og:title', post.title, 'property');
    updateMetaTag('og:description', post.excerpt, 'property');
    updateMetaTag('og:url', 'https://bootloader.live/posts/' + post.slug + '/', 'property');
    updateMetaTag('twitter:title', post.title);
    updateMetaTag('twitter:description', post.excerpt);

    var body = document.getElementById('post-body');
    body.textContent = '';
    var loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading';
    loadingDiv.textContent = 'Loading';
    body.appendChild(loadingDiv);

    var md;
    if (postCache[slug]) {
        md = postCache[slug];
    } else {
        try {
            var resp = await fetch('/posts/' + slug + '/' + post.file);
            md = await resp.text();
            postCache[slug] = md;
        } catch (e) {
            body.textContent = '';
            var errP = document.createElement('p');
            errP.style.color = 'var(--text-muted)';
            errP.textContent = 'Failed to load post: ' + e.message;
            body.appendChild(errP);
            return;
        }
    }

    var metaEl = document.getElementById('post-meta');
    metaEl.textContent = '';
    var dateSpan = document.createElement('span');
    dateSpan.textContent = formatDate(post.date);
    metaEl.appendChild(dateSpan);
    var dotSpan = document.createElement('span');
    dotSpan.className = 'post-meta-dot';
    dotSpan.textContent = '\u00B7';
    metaEl.appendChild(dotSpan);
    var timeSpan = document.createElement('span');
    timeSpan.textContent = readingTime(md, post.file.endsWith('.html'));
    metaEl.appendChild(timeSpan);

    var basePath = '/posts/' + slug + '/';
    var sanitizedHtml = post.file.endsWith('.html')
        ? sanitizeHtmlFragment(md, basePath)
        : renderMarkdown(md, basePath);

    body.textContent = '';
    var template = document.createElement('template');
    template.innerHTML = sanitizedHtml;
    body.appendChild(template.content);

    window.scrollTo(0, 0);

    await renderMermaidDiagrams();
    initSvgInteractions(document.querySelector('.post-content'));
    generateToc();
    fixThemeColors();

    document.querySelector('.post-content').classList.add('fade-in');
}

// ─── Handle Hash Changes (backward-compat for old /#/post/ URLs) ────
function handleRoute() {
    var hash = location.hash || '#/';
    if (hash === '#/' || hash === '#' || hash === '') {
        showLanding(true);
    } else if (hash.startsWith('#/post/')) {
        var slug = hash.replace('#/post/', '');
        showPost(slug, true);
        history.replaceState({ view: 'post', slug: slug }, '', '/posts/' + slug + '/');
    } else {
        showLanding(true);
    }
}

// ─── Init ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
    setTheme(getTheme());
    initMarked();

    // mermaid init happens in renderMermaidDiagrams (matching mdp)

    renderLanding();

    // Route based on pathname first (clean URLs), then fall back to hash routing
    var pathMatch = location.pathname.match(/^\/posts\/([^/]+)\/?$/);
    if (pathMatch) {
        showPost(pathMatch[1], true);
    } else {
        handleRoute();
    }

    window.addEventListener('scroll', updateReadingProgress);

    // Event listeners
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('toc-toggle').addEventListener('click', toggleToc);
    document.getElementById('back-btn-top').addEventListener('click', function() { showLanding(); });
    document.getElementById('back-btn-bottom').addEventListener('click', function() { showLanding(); });

    document.addEventListener('click', function(e) {
        var panel = document.getElementById('toc-panel');
        var toggle = document.getElementById('toc-toggle');
        if (panel.classList.contains('open') && !panel.contains(e.target) && !toggle.contains(e.target)) {
            panel.classList.remove('open');
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (currentView === 'post') { showLanding(); }
            document.getElementById('toc-panel').classList.remove('open');
        }
    });
});

// Browser back/forward navigation
window.addEventListener('popstate', function(e) {
    if (e.state && e.state.view === 'post') {
        showPost(e.state.slug, true);
    } else if (e.state && e.state.view === 'landing') {
        showLanding(true);
    } else {
        var pathMatch = location.pathname.match(/^\/posts\/([^/]+)\/?$/);
        if (pathMatch) {
            showPost(pathMatch[1], true);
        } else {
            handleRoute();
        }
    }
});

// Keep hashchange listener for backward-compat with old /#/post/ URLs
window.addEventListener('hashchange', handleRoute);
</script>
